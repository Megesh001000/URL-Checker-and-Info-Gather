{%extends 'detection/base.html' %}
{%load static%}
{%block content%}



<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg p-5 rounded-4 animate__animated animate__fadeInUp attachment-card">
                <h2 class="text-center mb-4">
                    <i class="fas fa-paperclip"></i> File Attachment Scanner
                </h2>
                <p class="text-center text-muted mb-4">
                    Upload your file (CSV, TXT, HTML, or EML) to analyze its safety and check for phishing patterns.
                </p>

                <!-- Upload Form -->
                <form method="POST" enctype="multipart/form-data" class="text-center">
                    {% csrf_token %}
                    <div class="mb-4">
                        {{ form.as_p }}
                    </div>

                    <button type="submit" class="btn btn-gradient btn-lg shadow-sm">
                        <i class="fas fa-upload"></i> Upload and Scan
                    </button>
                </form>

                <!-- Result Section -->
                {% if result %}
                <div class="alert alert-custom mt-4 text-center animate__animated animate__fadeIn">
                    <strong>{{ result }}</strong>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>

{%endblock%}
