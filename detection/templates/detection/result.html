{% extends 'detection/base.html' %}
{% block content %}
{%load static%}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-lg p-5 text-center result-card animate__animated animate__zoomIn ">
        <h2 class="mb-4">URL Safety Result</h2>

        <!-- Dynamic Result -->
        <div id="resultStatus" class="result-status mb-4">
          <h3 class="{{ css_class }} animate__animated animate__fadeIn">{{ message }}</h3>
        </div>

        <!-- Extra Info -->
        <div id="extraInfo" class="extra-info text-muted">
          <p><strong>URL:</strong> {{ url }}</p>
          <p>{{ tip }}</p>
        </div>

        <!-- Back Button -->
        <div class="mt-4">
          <a href="{% url 'home' %}" class="btn btn-outline-primary btn-lg animate__animated animate__fadeInUp">
            🔙 Check Another URL
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

 <style>
.result-card {
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(10px);
  color: #333;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.result-card:hover {
  transform: scale(1.02);
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
}

.text-success {
  background: rgba(40, 167, 69, 0.15);
  border: 2px solid #28a745;
  color: #28a745;
  padding: 10px;
  border-radius: 12px;
}

.text-warning {
  background: rgba(255, 193, 7, 0.15);
  border: 2px solid #ffc107;
  color: #856404;
  padding: 10px;
  border-radius: 12px;
}

.text-danger {
  background: rgba(220, 53, 69, 0.15);
  border: 2px solid #dc3545;
  color: #dc3545;
  padding: 10px;
  border-radius: 12px;
}

.result-status h3 {
  font-weight: 600;
  font-size: 1.5rem;
}
</style>

{% endblock %}
